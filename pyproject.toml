[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "infalsus-savecodec"
version = "1.0.0"
description = "MemoryPack <-> JSON codec for In Falsus's SingleFileSaveDataV2 save files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
savecodec = "savecodec.cli:main"

[tool.setuptools]
packages = ["savecodec"]
